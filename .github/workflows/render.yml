name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f -v

      - name: Render MP4
        run: npx remotion render AiVideoPreview out/ai-video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: ai-video
          path: out/ai-video.mp4
          retention-days: 7
