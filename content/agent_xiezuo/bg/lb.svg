<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- 标题区 -->
  <text x="24" y="42" fill="#f85149" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">代码混乱</text>
  
  <!-- 图标：杂乱线段与警告标志 -->
  <g transform="translate(24, 65)">
    <!-- 紊乱代码线段 -->
    <path d="M 0 10 Q 30 40 10 60 T 50 30" fill="none" stroke="#58a6ff" stroke-width="3"/>
    <path d="M 10 30 Q 50 0 60 50 T 20 70" fill="none" stroke="#d29922" stroke-width="2"/>
    <!-- 警告三角形 -->
    <polygon points="50,35 65,60 35,60" fill="#f85149"/>
    <text x="50" y="55" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">!</text>
  </g>
  
  <!-- 说明文字 -->
  <text x="110" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">代码越写越乱：</text>
  <text x="110" y="118" fill="#8b949e" font-family="sans-serif" font-size="14">缺乏合理架构，</text>
  <text x="110" y="142" fill="#8b949e" font-family="sans-serif" font-size="14">导致后期极难维护</text>
</svg>
