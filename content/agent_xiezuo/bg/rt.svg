<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- 标题区 -->
  <text x="24" y="42" fill="#f85149" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">测试遗漏</text>
  
  <!-- 图标：测试清单与错误 -->
  <g transform="translate(24, 60)">
    <rect x="10" y="10" width="50" height="65" rx="6" fill="#21262d" stroke="#8b949e" stroke-width="2"/>
    <!-- 夹子 -->
    <rect x="25" y="5" width="20" height="10" rx="2" fill="#8b949e"/>
    <!-- 错误列表标记 X -->
    <path d="M 20 25 L 28 33 M 28 25 L 20 33" stroke="#f85149" stroke-width="2"/>
    <line x1="34" y1="29" x2="50" y2="29" stroke="#8b949e" stroke-width="2"/>
    
    <path d="M 20 40 L 28 48 M 28 40 L 20 48" stroke="#f85149" stroke-width="2"/>
    <line x1="34" y1="44" x2="50" y2="44" stroke="#8b949e" stroke-width="2"/>
    
    <path d="M 20 55 L 28 63 M 28 55 L 20 63" stroke="#f85149" stroke-width="2"/>
    <line x1="34" y1="59" x2="50" y2="59" stroke="#8b949e" stroke-width="2"/>
  </g>
  
  <!-- 说明文字 -->
  <text x="100" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">测试漏了：</text>
  <text x="100" y="118" fill="#8b949e" font-family="sans-serif" font-size="14">代码开发完成，但</text>
  <text x="100" y="142" fill="#8b949e" font-family="sans-serif" font-size="14">测试用例未覆盖</text>
</svg>
