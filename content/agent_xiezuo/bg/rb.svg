<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- 标题区 -->
  <text x="24" y="42" fill="#f85149" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">安全与数据库忽略</text>
  
  <!-- 图标：锁与数据库 -->
  <g transform="translate(24, 65)">
    <!-- 锁头 -->
    <rect x="5" y="20" width="26" height="22" rx="3" fill="#d29922"/>
    <path d="M 11 20 V 12 A 7 7 0 0 1 25 12 V 20" fill="none" stroke="#d29922" stroke-width="3"/>
    <!-- 数据库圆筒 -->
    <g transform="translate(40, 5)">
      <ellipse cx="20" cy="10" rx="18" ry="6" fill="#58a6ff"/>
      <path d="M 2 10 V 25 C 2 30 38 30 38 25 V 10" fill="none" stroke="#58a6ff" stroke-width="2"/>
      <path d="M 2 25 V 40 C 2 45 38 45 38 40 V 25" fill="none" stroke="#58a6ff" stroke-width="2"/>
    </g>
  </g>
  
  <!-- 说明文字 -->
  <text x="110" y="85" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold">忽略数据库与安全：</text>
  <text x="110" y="112" fill="#8b949e" font-family="sans-serif" font-size="13">如做二手书网站写完页面</text>
  <text x="110" y="132" fill="#8b949e" font-family="sans-serif" font-size="13">就忘了后端数据库架构</text>
  <text x="110" y="152" fill="#8b949e" font-family="sans-serif" font-size="13">和安全漏洞防护</text>
</svg>
