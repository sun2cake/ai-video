<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="100%" height="100%">
  <defs>
    <!-- 机器人身体金属渐变 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- 阴影与发光滤镜 -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 中央 Agent 机器人（纯透明背景） -->
  <g transform="translate(0, -40)">
    <!-- 顶部思考云 -->
    <g transform="translate(0, -5)" filter="url(#dropShadow)">
      <path d="M 165 75 A 20 20 0 0 1 200 58 A 25 25 0 0 1 242 70 A 18 18 0 0 1 248 92 A 18 18 0 0 1 225 105 L 175 105 A 18 18 0 0 1 165 75 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <text x="202" y="91" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="800" text-anchor="middle" filter="url(#glow)">?</text>
    </g>

    <!-- 多手臂 -->
    <g stroke="url(#cyanGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#dropShadow)">
      <path d="M 150 210 Q 100 190 115 150"/>
      <circle cx="115" cy="150" r="6" fill="#38bdf8"/>
      <path d="M 250 210 Q 300 190 285 150"/>
      <circle cx="285" cy="150" r="6" fill="#38bdf8"/>
      <path d="M 150 240 Q 90 250 110 290"/>
      <circle cx="110" cy="290" r="6" fill="#818cf8"/>
      <path d="M 250 240 Q 310 250 290 290"/>
      <circle cx="290" cy="290" r="6" fill="#818cf8"/>
    </g>

    <!-- 主体 -->
    <g filter="url(#dropShadow)">
      <rect x="185" y="185" width="30" height="20" rx="5" fill="#64748b"/>
      <rect x="145" y="195" width="110" height="100" rx="24" fill="url(#bodyGrad)"/>
      <rect x="162" y="215" width="76" height="50" rx="12" fill="url(#screenGrad)" stroke="#334155" stroke-width="2"/>
      <rect x="172" y="227" width="56" height="16" rx="8" fill="#0369a1" opacity="0.4"/>
      <text x="200" y="239" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">AI AGENT</text>
      <circle cx="185" cy="253" r="3" fill="#f43f5e"/>
      <circle cx="200" cy="253" r="3" fill="#fbbf24"/>
      <circle cx="215" cy="253" r="3" fill="#34d399"/>

      <rect x="135" y="105" width="130" height="90" rx="28" fill="url(#headGrad)"/>
      <rect x="145" y="115" width="110" height="70" rx="20" fill="url(#screenGrad)"/>

      <g filter="url(#glow)">
        <circle cx="175" cy="148" r="10" fill="#38bdf8"/>
        <path d="M 166 142 L 184 150" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="225" cy="148" r="10" fill="#38bdf8"/>
        <path d="M 234 142 L 216 150" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
      </g>

      <path d="M 188 172 Q 200 165 212 172" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)"/>
      <circle cx="160" cy="162" r="4" fill="#f43f5e" opacity="0.5"/>
      <circle cx="240" cy="162" r="4" fill="#f43f5e" opacity="0.5"/>
    </g>
  </g>
</svg>
