<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="none"/>
  
  <!-- 标题区 -->
  <text x="24" y="42" fill="#f85149" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">需求忘失</text>
  
  <!-- 图标：带叉红圈与思考泡泡 -->
  <g transform="translate(24, 60)">
    <circle cx="36" cy="36" r="30" fill="#21262d" stroke="#f85149" stroke-width="2"/>
    <!-- 需求文档/泡泡 -->
    <rect x="20" y="20" width="32" height="32" rx="4" fill="none" stroke="#8b949e" stroke-width="2"/>
    <!-- 红色大叉 -->
    <path d="M 18 18 L 54 54 M 54 18 L 18 54" stroke="#f85149" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- 说明文字 -->
  <text x="110" y="90" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">需求忘了：</text>
  <text x="110" y="118" fill="#8b949e" font-family="sans-serif" font-size="14">关键需求在开发中</text>
  <text x="110" y="142" fill="#8b949e" font-family="sans-serif" font-size="14">被遗忘或遗漏</text>
</svg>
